version: '3.8'

services:
  nodeapp:
    build: .
    container_name: nodejs_app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5001
    ports:
      - "5001:5001"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nodeapp
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge 